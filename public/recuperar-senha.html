<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCAEE — Nova Senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="page">
    <div class="card">

      <div class="topo">
        <div class="badge"><span>SC</span></div>
        <h1>Nova Senha</h1>
        <p>Escolha uma senha com pelo menos 6 caracteres.</p>
      </div>

      <div class="aviso aviso-erro" id="msg-erro" hidden></div>
      <div class="aviso aviso-ok"   id="msg-ok"   hidden></div>

      <form id="form-nova-senha" novalidate>
        <div class="campo">
          <label for="senha1">Nova senha</label>
          <div class="senha-wrap">
            <input type="password" id="senha1" name="senha1" placeholder="••••••••" required>
            <button type="button" class="toggle-s" data-target="senha1">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="campo">
          <label for="senha2">Confirme a senha</label>
          <div class="senha-wrap">
            <input type="password" id="senha2" name="senha2" placeholder="••••••••" required>
            <button type="button" class="toggle-s" data-target="senha2">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-entrar">SALVAR SENHA</button>
        <a href="login.html" class="link-esqueci">← Voltar ao login</a>
      </form>
    </div>
  </div>
  <script src="js/recuperar-senha.js"></script>
</body>
</html>
