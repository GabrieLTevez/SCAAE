<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCAEE — Painel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-logo">
        <div class="badge"><span>SC</span></div>
        <div>
          <strong>SCAEE</strong>
          <small>Eventos Escolares</small>
        </div>
      </div>

      <button class="btn-novo" id="btn-abrir-form" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Novo Evento
      </button>

      <nav class="nav">
        <a href="#" class="nav-item ativo" id="nav-calendario" data-view="calendario">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Calendário
        </a>
        <a href="#" class="nav-item" id="nav-gestao" data-view="gestao" hidden>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Gestão de Eventos
        </a>
      </nav>
    </div>

    <div class="sidebar-bottom">
      <div class="usuario-info">
        <div class="avatar" id="avatar-inicial">?</div>
        <div>
          <span class="usuario-nome" id="usuario-nome">—</span>
          <span class="usuario-tipo"  id="usuario-tipo">—</span>
        </div>
      </div>
      <button class="btn-sair" id="btn-sair" title="Sair">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="main">
    <header class="topbar">
      <div>
        <h2 id="topbar-titulo">Calendário de Eventos</h2>
        <span class="subtitulo" id="data-hoje"></span>
      </div>
      <img src="imagens/Logo_cps.png" alt="CPS" class="logo-cps" onerror="this.style.display='none'">
    </header>

    <!-- VIEW: CALENDÁRIO -->
    <section class="area-calendario" id="view-calendario">
      <div class="calendario-wrap">
        <div class="cal-header">
          <button class="cal-nav" id="cal-prev">&#8249;</button>
          <h3 id="cal-titulo"></h3>
          <button class="cal-nav" id="cal-next">&#8250;</button>
        </div>
        <div class="cal-dias-semana">
          <span>Dom</span><span>Seg</span><span>Ter</span>
          <span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-legenda">
          <span class="leg-item"><i style="background:#7F1CE2"></i> Interno</span>
          <span class="leg-item"><i style="background:#00c16a"></i> Aberto</span>
          <span class="leg-item"><i style="background:#4395D0"></i> Com Convidado</span>
        </div>
      </div>
      <div class="painel-eventos">
        <div class="painel-header">
          <h4 id="painel-titulo">Selecione um dia</h4>
          <div class="filtros">
            <button class="filtro ativo" data-filtro="todos">Todos</button>
            <button class="filtro" data-filtro="Interno">Interno</button>
            <button class="filtro" data-filtro="Aberto">Aberto</button>
            <button class="filtro" data-filtro="Convidado">Convidado</button>
          </div>
        </div>
        <div class="eventos-lista" id="eventos-lista">
          <div class="vazio">Clique em um dia para ver os eventos.</div>
        </div>
      </div>
    </section>

    <!-- VIEW: GESTÃO -->
    <section class="area-gestao" id="view-gestao" hidden>
      <div class="gestao-toolbar">
        <input type="text" class="gestao-busca" id="gestao-busca" placeholder="🔍  Buscar evento…">
        <select class="gestao-filtro-tipo" id="gestao-filtro-tipo">
          <option value="">Todos os tipos</option>
          <option value="Interno">Interno</option>
          <option value="Aberto">Aberto</option>
          <option value="Convidado">Com Convidado</option>
        </select>
      </div>
      <div class="tabela-wrap">
        <table class="tabela-eventos" id="tabela-eventos">
          <thead>
            <tr>
              <th>Tipo</th>
              <th>Evento</th>
              <th>Data</th>
              <th>Horário</th>
              <th>Local</th>
              <th>Responsável</th>
              <th>Curso</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-body">
            <tr><td colspan="8" class="tabela-vazio">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- OVERLAY -->
  <div class="overlay" id="overlay"></div>

  <!-- DRAWER: CADASTRAR / EDITAR EVENTO -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer-header">
      <h3 id="drawer-titulo">Cadastrar Evento</h3>
      <button class="btn-fechar" id="btn-fechar-form">✕</button>
    </div>

    <form id="form-evento" novalidate>
      <input type="hidden" id="evento-id"  name="id"    value="">
      <input type="hidden" id="color"      name="color" value="">

      <div class="campo-grupo">
        <label class="label-sec">Tipo de evento</label>
        <div class="radios">
          <label class="radio-label radio-interno">
            <input type="radio" name="tipo" value="Interno"   class="radio-tipo" required>
            <span></span> Interno
          </label>
          <label class="radio-label radio-aberto">
            <input type="radio" name="tipo" value="Aberto"    class="radio-tipo">
            <span></span> Aberto
          </label>
          <label class="radio-label radio-convidado">
            <input type="radio" name="tipo" value="Convidado" class="radio-tipo">
            <span></span> Com Convidado
          </label>
        </div>
      </div>

      <div class="campo-grupo">
        <label for="titulo">Nome do evento</label>
        <input type="text" id="titulo" name="titulo" placeholder="Ex: Semana da Tecnologia" required>
      </div>

      <div class="campo-linha">
        <div class="campo-grupo">
          <label for="startdate">Data inicial</label>
          <input type="date" id="startdate" name="startdate" required>
        </div>
        <div class="campo-grupo">
          <label for="enddate">Data final</label>
          <input type="date" id="enddate" name="enddate" required>
        </div>
      </div>

      <div class="campo-linha">
        <div class="campo-grupo">
          <label for="startime">Hora inicial</label>
          <input type="time" id="startime" name="startime" required>
        </div>
        <div class="campo-grupo">
          <label for="endtime">Hora final</label>
          <input type="time" id="endtime" name="endtime" required>
        </div>
      </div>

      <div class="campo-grupo">
        <label for="local1">Local</label>
        <select id="local1" name="local1" required>
          <option value="">Selecione…</option>
          <option value="quadra">Quadra</option>
          <option value="sala-video">Sala de Vídeo</option>
          <option value="auditorio">Auditório</option>
          <option value="laboratorio">Laboratório</option>
          <option value="patio">Pátio</option>
        </select>
      </div>

      <div class="campo-grupo">
        <label for="nome">Responsável</label>
        <input list="lista-prof" id="nome" name="nome" placeholder="Nome do professor…" required>
        <datalist id="lista-prof">
          <option value="Marcela Campos">
          <option value="Claudemir Santos Pinto">
          <option value="Sérgio Salum">
        </datalist>
      </div>

      <div class="campo-linha tres">
        <div class="campo-grupo">
          <label for="base">Base</label>
          <select id="base" name="base" required>
            <option value="">—</option>
            <option>Técnica</option>
            <option>Comum</option>
          </select>
        </div>
        <div class="campo-grupo">
          <label for="ano">Ano</label>
          <select id="ano" name="ano" required>
            <option value="">—</option>
            <option>1°</option>
            <option>2°</option>
            <option>3°</option>
          </select>
        </div>
        <div class="campo-grupo">
          <label for="coord">Coord.</label>
          <input list="lista-coord" id="coord" name="coord" placeholder="Coordenador…" required>
          <datalist id="lista-coord">
            <option value="Cláudia">
            <option value="Sérgio">
            <option value="Denise">
            <option value="Eunice">
            <option value="Mariluz">
          </datalist>
        </div>
      </div>

      <div class="campo-grupo">
        <label for="curso">Curso</label>
        <input list="lista-curso" id="curso" name="curso" placeholder="Curso…" required>
        <datalist id="lista-curso">
          <option value="Nutrição">
          <option value="Mecânica">
          <option value="Desenvolvimento de Sistemas">
          <option value="Administração">
          <option value="Serviços Jurídicos">
        </datalist>
      </div>

      <div class="campo-grupo">
        <label for="descricao">Descrição</label>
        <textarea id="descricao" name="descricao" rows="3" placeholder="Detalhes do evento…" required></textarea>
      </div>

      <div class="form-acoes">
        <button type="button" class="btn-cancelar" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn-confirmar" id="btn-confirmar">Confirmar</button>
      </div>
    </form>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
