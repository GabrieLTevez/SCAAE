<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCAEE — Recuperar Senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="page">
    <div class="card">

      <div class="topo">
        <div class="badge"><span>SC</span></div>
        <h1>Recuperar Senha</h1>
        <p>Digite seu e-mail e enviaremos<br>as instruções de redefinição.</p>
      </div>

      <div class="aviso aviso-erro" id="msg-erro" hidden></div>
      <div class="aviso aviso-ok"   id="msg-ok"   hidden></div>

      <form id="form-recuperar" novalidate>
        <div class="campo">
          <label for="email">E-mail institucional</label>
          <input type="email" id="email" name="email"
                 placeholder="seu@email.edu.br" required>
        </div>

        <button type="submit" class="btn-entrar">ENVIAR INSTRUÇÕES</button>
        <a href="login.html" class="link-esqueci">← Voltar ao login</a>
      </form>
    </div>
  </div>
  <script src="js/esqueci-senha.js"></script>
</body>
</html>
